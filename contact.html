    <main>
        <div class="container">
            <h1>Contact Us</h1>
            <div class="underline"></div>
            <form id="contact-form">
                <div class="name">
                    <label for="first">First Name</label>
                    <input id="first" name="first_name" type="text" required>
                </div>
                <div class="name">
                    <label for="last">Last Name</label>
                    <input id="last" name="last_name" type="text" required>
                </div>
                <div class="email">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="email">
                    <label for="confirm">Confirm Email Address</label>
                    <input id="confirm" name="confirm_email" type="email" required>
                </div>
                <div class="textbox">
                    <label for="questions">Questions or Comments</label>
                    <textarea id="questions" name="question_box" required></textarea>
                </div>
                <button id="contact-bttn" type="submit">Submit</button>
            </form>
        </div>
    </main>
